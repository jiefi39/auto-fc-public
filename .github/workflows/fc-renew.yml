# =============================================================================
# FC 实例自动重建（公开仓库版）
# -----------------------------------------------------------------------------
# 结构照 auto_scripts/.github/workflows/hus-renew.yml 抄的：
#   公开仓库只放 workflow + 时间文件，真正的代码在私有仓库 jyucoeng/fc-private，
#   运行时用 PRIVATE_REPO_TOKEN 检出到工作区子目录里跑。
#
# 和 hus 版的差别（都是因为这个项目本身的特性）：
#   1. **纯标准库**：没有 requirements.txt，所以跳过 pip install / cache。
#   2. **每天跑一次 + --if-due**：实例是 30 天周期，脚本自己判断「距到期不足 2 天」
#      才动手；cron 表达不了「每 29 天」，所以靠每天检查 + 到期判断。
#   3. **登录代理**：面板对来源 IP 敏感，PROXY_CONTENT 交给私有库里的
#      gen_singbox_config.py + sing-box 起本地 mixed 端口，登录走它出去。
#   4. **TG 报告在脚本里发**：私有库里的通知模块每个账号跑完发一条，
#      所以 workflow 这边不需要额外的通知步骤。
#
# 私有库里不含任何 workflow —— 本文件是唯一跑定时任务的地方。
#
# 需要配置的 Secrets（公开仓库 → Settings → Secrets and variables → Actions）：
#   PRIVATE_SSH_KEY      fc-private 的只读部署密钥（deploy key）私钥
#   FC_USER              用户名或邮箱
#   FC_PASS              密码
#   FC_TG_TOKEN          Telegram Bot Token（可选，不配就不发报告）
#   FC_TG_CHAT           Telegram chat id（可选，多个用逗号分隔）
#   HY2_PROXY_URL    节点 URL：hy2:// vless:// trojan:// ss:// tuic:// anytls://
#                        （可选，不配就直连）
#
# Variables（可选）：
#   FC_INTERVAL_DAYS       默认 29
#   FC_DUE_DAYS            默认 2（→ 开通第 29 天动手）
# =============================================================================

name: 🔄 FC 实例重建 ①

on:
  schedule:
    # UTC 19:23 = 北京时间次日 03:23。避开整点，也避开 hus 系列的 00:07。
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: "阶段"
        type: choice
        options: [auto, open, maintain]
        default: auto
      force:
        description: "忽略到期检查，强制执行"
        type: boolean
        default: false
      dry_run:
        description: "只体检，不动手"
        type: boolean
        default: false

permissions:
  contents: write     # 最后要提交 time.txt 保活
  actions: write      # 清理旧运行记录

jobs:
  renew:
    runs-on: ubuntu-24.04
    # 单账号约 3 分钟；多账号线性增长；再加上代理启动与重试，40 分钟够用。
    timeout-minutes: 40
    concurrency:
      group: FC_Renew_1
      # 手动触发不抢占正在跑的定时任务——那会把正在重建的实例打断在半路。
      cancel-in-progress: false
    env:
      # ── 凭据 ──────────────────────────────────────────────────────────
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      # ── 通知 ──────────────────────────────────────────────────────────
      FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
      FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
      # ── 登录代理 ──────────────────────────────────────────────────────
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: '10808'
      # ── 周期 ──────────────────────────────────────────────────────────
      FC_INTERVAL_DAYS: ${{ vars.FC_INTERVAL_DAYS || '29' }}
      FC_DUE_DAYS: ${{ vars.FC_DUE_DAYS || '2' }}
      # ── 私有仓库 ──────────────────────────────────────────────────────
      PRIVATE_REPO: jyucoeng/fc-private
      PROJECT_DIR: fc-private
      TIME_DIR: fc/1

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v7

      - name: 检出私有仓库
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::没有 PRIVATE_SSH_KEY，无法检出私有仓库"
            exit 1
          fi

          # 用只读部署密钥检出：权限只有「读这一个仓库」，不过期，
          # 比 PAT 小得多（PAT 是整个账号的 repo 权限）。
          key="$RUNNER_TEMP/fc_deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git clone --depth 1 "git@github.com:${PRIVATE_REPO}.git" "$PROJECT_DIR"

          # 别让密钥留在 .git/config 里（私有库是检出在公开库工作区内部的）
          git -C "$PROJECT_DIR" remote set-url origin "https://github.com/${PRIVATE_REPO}.git"
          rm -f "$key"

      - name: 校验凭据
        id: check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys

          # 入口自检：确认私有库里的脚本在 runner 上起得来（只跑 --help，不登录不联网）。
          # 放在最前面，所以「只保活」模式下也会跑到。
          r = subprocess.run([sys.executable, "fc.py", "--help"],
                             capture_output=True, text=True)
          if r.returncode != 0:
              raise SystemExit("fc.py --help 失败：%s" % (r.stderr or r.stdout)[:400])
          print("入口自检：fc.py --help OK")

          # 先把「配了什么」打出来 —— 只保活模式下也要能看到
          # 注意：Secret 名和进程里的环境变量名不一定一样
          #   HY2_PROXY_URL（Secret） → PROXY_CONTENT（环境变量）
          for secret_name, env_name in (("FC_TG_TOKEN", "FC_TG_TOKEN"),
                                        ("HY2_PROXY_URL", "PROXY_CONTENT")):
              print("%-20s %s" % (secret_name,
                                  "已配置" if os.environ.get(env_name, "").strip() else "未配置"))

          user = os.environ.get("FC_USER", "").strip()
          pwd = os.environ.get("FC_PASS", "").strip()

          def mask(s):
              # 账号可能是邮箱，也可能是纯用户名（如 dora），规则和通知模块一致：
              # 有 @ 就取前面那段；>6 位留前 3 后 3，>3 位留前 1 后 1，再短就全星掉
              local = s.split("@")[0]
              if len(local) > 6:
                  return local[:3] + "***" + local[-3:]
              if len(local) > 3:
                  return local[0] + "***" + local[-1]
              return "***"

          if user and pwd:
              print("账号：%s" % mask(user))
          else:
              # 没配凭据不报错：这个仓库也可以只当「保活/备份」用，
              # 那样每天红一次毫无意义。标记一下，跳过运行步骤即可。
              print("没配凭据 → 本次只保活，不跑维护")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("has_creds=false\n")
              raise SystemExit(0)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("has_creds=true\n")
          PY

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # 没有 requirements.txt：项目只依赖标准库，所以不装 pip 包、也不用 cache。

      - name: 安装代理（sing-box）
        if: steps.check.outputs.has_creds == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置 PROXY_CONTENT，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        if: steps.check.outputs.has_creds == 'true'
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 运行
        if: steps.check.outputs.has_creds == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ARGS="--phase ${{ inputs.phase || 'auto' }}"
          if [ "${{ inputs.force }}" != "true" ]; then
            ARGS="$ARGS --if-due"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # 不要用 `python3 ... | tee log`：管道里 $! 是 tee 的 PID，
          # 退出码永远是 0，脚本失败会被吞掉。重定向 + wait 真实 PID。
          echo "运行：python3 fc.py $ARGS"
          python3 -u fc.py $ARGS > fc.log 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[HEARTBEAT] 仍在运行: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sleep 15
          done
          status=0
          wait "$pid" || status=$?
          echo "---- 退出码: ${status} ----"
          tail -n 80 fc.log || true
          exit "$status"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc-log-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/fc.log
          retention-days: 7
          if-no-files-found: warn

      - name: 提交执行时间
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 每次以最新 origin/main 为基准重建提交，避免并发 run 互相覆盖。
          for attempt in 1 2 3; do
            echo "提交执行时间，第 ${attempt}/3 次尝试"
            git fetch origin refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            mkdir -p "${{ env.TIME_DIR }}"
            date +'%Y-%m-%d %H:%M:%S' > "${{ env.TIME_DIR }}/time.txt"
            git add "${{ env.TIME_DIR }}/time.txt"
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin HEAD:refs/heads/main; then
              echo "执行时间已提交"
              exit 0
            fi
            echo "推送发生并发冲突，重新获取远端后重试"
            git reset --hard origin/main
            sleep 2
          done
          echo "3 次推送均失败"
          exit 1

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current_run="${{ github.run_id }}"
          cutoff_epoch=$(date -d '24 hours ago' +%s)
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit=100 \
            --json databaseId,createdAt,status \
            --jq '.[] | [.databaseId, .createdAt, .status] | @tsv' 2>/dev/null)
          if [ -z "$runs" ]; then
            echo "没有找到可清理的运行记录"
            exit 0
          fi

          to_delete=$(while IFS=$'\t' read -r run_id created_at status; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$current_run" ] && continue
            [ "$status" != "completed" ] && continue
            created_epoch=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            [ "$created_epoch" -ge "$cutoff_epoch" ] && continue
            echo "$run_id"
          done <<< "$runs")

          if [ -z "$to_delete" ]; then
            echo "清理完成：没有超过 24 小时的已完成记录"
            exit 0
          fi

          count=$(echo "$to_delete" | wc -l | tr -d ' ')
          echo "待删除 $count 条超过 24 小时的已完成记录（并发 10 路）"
          echo "$to_delete" | xargs -P 10 -I{} sh -c 'gh run delete "$1" --repo "$2" >/dev/null 2>&1 || true' _ {} "$GITHUB_REPOSITORY"
          echo "清理完成：保留最近 24 小时记录及所有未完成记录"
