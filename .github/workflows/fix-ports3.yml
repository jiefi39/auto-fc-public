name: 🔧 补齐 sharp 的端口段（临时）
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      FC_USER: ${{ secrets.FC_USER_3 }}
      FC_PASS: ${{ secrets.FC_PASS_3 }}
      FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
      FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 补齐端口段并出报告
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          def rules(p, uuid):
              d = p.instance(uuid)
              return [(r.get("protocol"), r.get("port"), r.get("span"))
                      for r in (d.get("ports") or [])]

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              inst = p.instances()[0]
              uuid = inst["uuid"]
              print("实例：%s (%s)" % (inst.get("name"), uuid))

              raw = p.port_blocks()
              print("=== /port-blocks 原文 ===")
              for b in raw.get("blocks") or []:
                  print("  %s" % json.dumps(b, ensure_ascii=False))

              print("=== 现有规则 ===")
              for r in rules(p, uuid):
                  print("  %s" % (r,))

              blocks = M.stable_port_blocks(p)
              print("账号级号段：%s" % (blocks,))
              target = None
              for b in raw.get("blocks") or []:
                  if int(b.get("start") or 0) <= 12700 < int(b.get("start") or 0) + int(b.get("size") or 0):
                      target = b
              if not target:
                  raise SystemExit("没找到含 12700 的号段")

              have = {(r[0], r[1]) for r in rules(p, uuid)}
              if ("both", 12700) in have:
                  print("12700-12709 已经在规则里了")
              else:
                  print("映射 12700-12709（both）…")
                  print(p.map_block(uuid, target["id"], "both",
                                    [{"start": 12700, "span": 10}]))
              print("=== 补齐后规则 ===")
              for r in rules(p, uuid):
                  print("  %s" % (r,))
          finally:
              sess.stop()
          PY
