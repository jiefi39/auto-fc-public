name: 🔧 补齐 sharp 的端口段（临时）
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      FC_USER: ${{ secrets.FC_USER_3 }}
      FC_PASS: ${{ secrets.FC_PASS_3 }}
      FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
      FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 看 sharp 现在的端口状态
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              inst = p.instances()[0]
              uuid = inst["uuid"]
              print("实例：%s (%s)" % (inst.get("name"), uuid))

              for b in p.port_blocks().get("blocks") or []:
                  print("号段 %s %s-%s free=%s paid_until=%s used=%s"
                        % (b["id"], b["start"], b["start"] + b["size"] - 1,
                           b.get("free"), b.get("paid_until"), b.get("used")))
                  for r in b.get("ranges") or []:
                      print("  段  %s %s-%s  %s"
                            % (r.get("protocol"), r.get("start"),
                               r.get("start") + r.get("span", 1) - 1,
                               r.get("instance_name")))
                  for r in b.get("ports") or []:
                      print("  单  %s %s -> %s  %s"
                            % (r.get("protocol"), r.get("port"),
                               r.get("target_port"), r.get("instance_name")))

              print("stable_port_blocks：%s" % (M.stable_port_blocks(p),))
              cands = M.stable_port_candidates(p)
              print("候选端口前 5 个：%s（共 %d）" % (cands[:5], len(cands)))

              print("再跑一次 add_ports（应该什么都不用加）：")
              print("  %s" % (M.add_ports(p, uuid, 5, 2, total_ports=20),))

              d = p.instance(uuid)
              print("实例详情里和端口有关的键：%s"
                    % [k for k in d if "port" in k.lower()])
              for k in d:
                  if "port" in k.lower():
                      print("  %s = %s" % (k, json.dumps(d[k], ensure_ascii=False)[:400]))
          finally:
              sess.stop()
          PY
