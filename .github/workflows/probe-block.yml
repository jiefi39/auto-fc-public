name: 🔍 号段续费与分段映射（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 恢复端口（改用段）+ 试续号段
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None,
                     "port_block_days": 90}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              uuid = p.instances()[0]["uuid"]

              def mine():
                  out = []
                  for b in p.port_blocks()["blocks"]:
                      for r in (b.get("ports") or []):
                          if r.get("instance_uuid") == uuid:
                              out.append((r["protocol"], r["port"], r.get("span", 1)))
                  return sorted(out, key=lambda x: x[1])

              print("=== 现在（应为空，刚才拆光了）===")
              print("  %s  空闲 %s" % (mine(), p.free_ports(uuid).get("total")))

              print("\n=== 用段恢复：TCP 5 + UDP 2 ===")
              done = M.add_ports(p, uuid, 5, 2,
                                 prefer=M.stable_port_candidates(p))
              time.sleep(2)

              print("\n=== 结果 ===")
              after = mine()
              for proto, port, span in after:
                  print("  %s %s%s" % (proto, port,
                                       "-%d" % (port + span - 1) if span > 1 else ""))
              print("  规则条数 %s / max_ports %s，空闲端口 %s"
                    % (len(after), p.instance(uuid).get("max_ports"),
                       p.free_ports(uuid).get("total")))

              print("\n=== 号段续费（真实试一次）===")
              out = M.renew_port_blocks(p, cfg, dry_run=False)
              print("  renew_port_blocks 返回：%s" % out)

              b13 = [b for b in p.port_blocks()["blocks"] if b["id"] == 13][0]
              print("  号段 13 现在付到：%s" % b13["paid_until"])
              try:
                  r = p.port_block_renew(13, 1)
                  print("  手动续 1 个月成功：%s" % json.dumps(r, ensure_ascii=False)[:300])
                  b13 = [b for b in p.port_blocks()["blocks"] if b["id"] == 13][0]
                  print("  新的 paid_until：%s" % b13["paid_until"])
              except PanelError as e:
                  print("  手动续 1 个月失败：%s" % e)
          finally:
              sess.stop()
          PY
