name: 🔍 容量与价格（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      FC_USER_2: ${{ secrets.FC_USER_2 }}
      FC_PASS_2: ${{ secrets.FC_PASS_2 }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 看规格与盘的价格（只读）
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              for which, user, pwd in (("1", os.environ["FC_USER"], os.environ["FC_PASS"]),
                                       ("2", os.environ["FC_USER_2"], os.environ["FC_PASS_2"])):
                  print("\n########## 账号 %s ##########" % which)
                  cfg = {"user": user, "password": pwd, "proxy": sess.url,
                         "fingerprint": None, "session_file": None}
                  p = Panel(proxy=sess.url)
                  me = M.login(p, cfg)
                  opts = p.order_options()

                  print("=== 各地区的规格（vcores / mem / 系统盘价）===")
                  for r in opts.get("regions") or []:
                      print("  地区 %s %s  disk_gb_monthly=%s"
                            % (r.get("id"), r.get("name"), r.get("disk_gb_monthly")))
                      for s in r.get("specs") or []:
                          print("    规格 %s %-14s %s核 %sMB free_disk_gb=%s"
                                % (s.get("id"), s.get("name"), s.get("vcores"),
                                   s.get("memory_mb"), s.get("free_disk_gb")))

                  print("=== 头衔专属价（0 元的）===")
                  for pr in M.title_promos(opts):
                      print("  地区 %s 规格 %s 首月 %s 优惠 %s 个月 disk_gb_price=%s upto=%s"
                            % (pr.get("region_id"), pr.get("spec_id"),
                               pr.get("monthly_price"), pr.get("months"),
                               pr.get("disk_gb_price"), pr.get("disk_gb_upto")))

                  print("=== 数据盘 options ===")
                  dd = p.disks()
                  print("  max_gb=%s max_months=%s" % (dd.get("max_gb"), dd.get("max_months")))
                  print(json.dumps(dd.get("options"), ensure_ascii=False)[:600])

                  print("=== 扩容报价（看多大以内还是 0 元）===")
                  disk = (dd.get("disks") or [None])[0]
                  if disk:
                      for gb in (5, 10, 20, 30, 50, 100, 200, 500):
                          try:
                              q = p.get("/api/panel/console/disks/%s/grow-quote?size_gb=%d"
                                        % (disk["id"], gb))
                              print("  从 %sGB 扩到 %3dGB -> %s"
                                    % (disk.get("size_gb"), gb,
                                       json.dumps(q, ensure_ascii=False)[:200]))
                          except PanelError as e:
                              print("  扩到 %3dGB 失败：%s" % (gb, e))
          finally:
              sess.stop()
          PY
