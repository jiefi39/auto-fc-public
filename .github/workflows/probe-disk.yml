name: 🔍 数据盘条款（临时）
on:
  workflow_dispatch:
    inputs:
      acct:
        description: "账号"
        type: choice
        options: [1, 2]
        default: "2"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 数据盘续费（两个账号都跑）
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              for which, user, pwd in (("2", os.environ["FC_USER_2"], os.environ["FC_PASS_2"]),
                                       ("1", os.environ["FC_USER"], os.environ["FC_PASS"])):
                  print("\n########## 账号 %s ##########" % which)
                  cfg = {"user": user, "password": pwd, "proxy": sess.url,
                         "fingerprint": None, "session_file": None,
                         "port_block_days": 7}
                  p = Panel(proxy=sess.url)
                  M.login(p, cfg)

                  def show(tag):
                      print("%s" % tag)
                      for d in p.disks().get("disks") or []:
                          mnt = (d.get("mounts") or [{}])[0]
                          print("  盘 %s  %s GB  挂 %s  paid_until=%s"
                                % (d.get("id"), d.get("size_gb"),
                                   mnt.get("path"), d.get("paid_until")))
                          try:
                              t = p.disk_renew_terms(d.get("id"))
                              print("      免费月数=%d can_renew=%s totals前3=%s"
                                    % (M.free_renew_months(t), t.get("can_renew"),
                                       (t.get("totals") or [])[:3]))
                          except PanelError as e:
                              print("      条款：%s" % e)

                  show("=== 续之前 ===")
                  print("--- dry-run ---")
                  for row in M.renew_disks(p, cfg, dry_run=True):
                      print("  %s" % (row,))
                  print("--- 真续 ---")
                  for row in M.renew_disks(p, cfg):
                      print("  %s" % (row,))
                  show("=== 续之后 ===")
          finally:
              sess.stop()
          PY
        env:
          FC_USER: ${{ secrets.FC_USER }}
          FC_PASS: ${{ secrets.FC_PASS }}
          FC_USER_2: ${{ secrets.FC_USER_2 }}
          FC_PASS_2: ${{ secrets.FC_PASS_2 }}
