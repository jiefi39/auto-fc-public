name: 🔍 端口探查（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: '10808'
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装代理
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version | head -1

      - name: 清理测试端口
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          import firadio_maintain as M
          from firadio_panel import Panel
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              uuid = p.instances()[0]["uuid"]

              print("清理前 total=%s" % p.free_ports(uuid).get("total"))
              for domain in (1, 0):
                  try:
                      p.remove_port(uuid, 13000, domain=domain)
                      print("  已删除 13000（domain=%d）" % domain)
                      break
                  except Exception as e:
                      print("  domain=%d 删不掉：%s" % (domain, e))
              time.sleep(2)
              print("清理后 total=%s（109 = 干净）" % p.free_ports(uuid).get("total"))
              print("  再搜 13000 → %s" % (p.free_ports(uuid, q="13000").get("ports") or []))
              full = p.instance(uuid)
              print("  max_ports=%s" % full.get("max_ports"))
          finally:
              sess.stop()
          PY
