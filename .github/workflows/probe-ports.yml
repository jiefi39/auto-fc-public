name: 🔍 端口探查（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: '10808'
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装代理
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pynacl 2>/dev/null || true
          bash -c 'curl -sL https://raw.githubusercontent.com/SagerNet/sing-box/main/install.sh | bash' 2>/dev/null || \
            (curl -sL -o /tmp/sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz" && \
             tar xzf /tmp/sb.tgz -C /tmp && cp /tmp/sing-box-*/sing-box /usr/local/bin/)
          sing-box version | head -1
          python3 firadio_proxy.py --content "$PROXY_CONTENT" --port 10808 --out /tmp/sb.json
          nohup sing-box run -c /tmp/sb.json > /tmp/sb.log 2>&1 &
          sleep 5
          curl -s -m 15 -x http://127.0.0.1:10808 https://api.ipify.org && echo " ← 代理出口 IP"

      - name: 探查端口
        working-directory: fc-private
        run: |
          set -euo pipefail
          export FIRADIO_PROXY_URL="http://127.0.0.1:10808"
          python3 - <<'PY'
          import json, os
          from firadio_panel import Panel, API_CONSOLE

          p = Panel()
          p.proxy = os.environ["FIRADIO_PROXY_URL"]
          p.login(os.environ["FC_USER"], os.environ["FC_PASS"])
          print("登录成功")

          insts = p.instances()
          print("\n=== 实例 ===")
          for it in insts:
              print("  %s  uuid=%s  host=%s" % (it.get("name"), it.get("uuid"), it.get("host_id")))

          it = insts[0]
          uuid = it["uuid"]

          print("\n=== 当前端口映射 ===")
          ports = p.get(API_CONSOLE + "/instances/%s/ports" % uuid)
          print(json.dumps(ports, ensure_ascii=False)[:1200])

          print("\n=== 空闲端口总数 ===")
          free = p.free_ports(uuid)
          total = free.get("total")
          plist = free.get("ports") or []
          print("  total=%s  本页=%d  前 10 个=%s" % (total, len(plist), plist[:10]))

          print("\n=== 逐个查历史端口是否可分配 ===")
          for want in (13131, 13132, 13133, 13134, 13135, 13136, 13137, 10091, 10092, 20000, 30000):
              r = p.free_ports(uuid, q=str(want))
              got = r.get("ports") or []
              print("  搜 %-6s → %s%s" % (want, got[:6], "" if want in got else "   ← 不在列表里"))

          print("\n=== 端口号段 ===")
          try:
              print(json.dumps(p.port_blocks(), ensure_ascii=False)[:800])
          except Exception as e:
              print("  取不到：%s" % e)

          print("\n=== 所有空闲端口（最多 200 个）===")
          allp, off = [], 0
          while len(allp) < 200:
              r = p.free_ports(uuid, "", off)
              chunk = r.get("ports") or []
              if not chunk:
                  break
              allp += chunk
              off += len(chunk)
              if off >= (r.get("total") or 0):
                  break
          print("  ", allp[:200])
          print("  历史端口 13131-13137 在里面吗：",
                [x for x in range(13131, 13138) if x in allp] or "一个都不在")
          PY
