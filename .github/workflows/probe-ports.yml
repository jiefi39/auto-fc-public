name: 🔍 端口迁移（临时）
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 核对并清理残留映射
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              uuid = p.instances()[0]["uuid"]

              data = p.port_blocks()
              print("=== 号段里挂在这台实例上的端口 ===")
              mine = []
              for b in (data.get("blocks") or []):
                  rows = b.get("ports") or []
                  hit = [r for r in rows if r.get("instance_uuid") == uuid]
                  print("  号段 %s  %s-%s  free=%s  本实例 %d 条%s"
                        % (b.get("id"), b.get("start"),
                           int(b.get("start")) + int(b.get("size")) - 1,
                           b.get("free"), len(hit),
                           ("  " + str([(r["protocol"], r["port"]) for r in hit])) if hit else ""))
                  mine += [(r["protocol"], r["port"]) for r in hit]

              stale = [(pr, po) for pr, po in mine if po < 13000]
              print("\n本实例共 %d 条映射，其中 13000 以下的残留：%s" % (len(mine), stale))

              for proto, port in stale:
                  for domain in (1, 0):
                      try:
                          p.remove_port(uuid, port, domain=domain)
                          print("  删残留 %s:%s ✅" % (proto, port))
                          break
                      except PanelError as e:
                          if domain == 0:
                              print("  删 %s:%s 失败：%s" % (proto, port, e))
                  time.sleep(0.5)

              time.sleep(2)
              data = p.port_blocks()
              final = []
              for b in (data.get("blocks") or []):
                  for r in (b.get("ports") or []):
                      if r.get("instance_uuid") == uuid:
                          final.append((r["protocol"], r["port"], r.get("target_port")))
              print("\n=== 最终映射（%d 条，max_ports=%s）==="
                    % (len(final), p.instance(uuid).get("max_ports")))
              for proto, port, target in sorted(final, key=lambda x: x[1]):
                  print("  %s  %s -> %s" % (proto, port, target))
              print("  空闲端口数：%s" % p.free_ports(uuid).get("total"))
          finally:
              sess.stop()
          PY
