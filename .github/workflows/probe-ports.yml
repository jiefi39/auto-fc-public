name: 🔍 端口探查（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      SOCKS_PORT: '10808'
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装代理
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version | head -1

      - name: 探查端口
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel, API_CONSOLE
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          print("代理就绪：%s  出口 IP：%s" % (sess.url, sess.exit_ip))
          proxy = sess.url
          cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                 "proxy": proxy, "fingerprint": None, "session_file": None}
          p = Panel(proxy=proxy)
          M.login(p, cfg)
          print("登录成功")

          insts = p.instances()
          print("\n=== 实例 ===")
          for it in insts:
              print("  %s  uuid=%s  host=%s  spec=%s"
                    % (it.get("name"), it.get("uuid"), it.get("host_id"), it.get("spec_name")))
          uuid = insts[0]["uuid"]

          print("\n=== 当前端口映射 ===")
          print(json.dumps(p.get(API_CONSOLE + "/instances/%s/ports" % uuid),
                           ensure_ascii=False)[:1500])

          print("\n=== 空闲端口总数 ===")
          free = p.free_ports(uuid)
          print("  total=%s  本页 %d 个  前 12 个=%s"
                % (free.get("total"), len(free.get("ports") or []),
                   (free.get("ports") or [])[:12]))

          print("\n=== 逐个搜历史端口 ===")
          for want in (13131, 13132, 13133, 13134, 13135, 13136, 13137, 10091, 20000, 30000):
              r = p.free_ports(uuid, q=str(want))
              got = r.get("ports") or []
              mark = "" if want in got else "   ← 搜不到"
              print("  搜 %-6s → %s%s" % (want, got[:6], mark))

          print("\n=== 端口号段 ===")
          try:
              print(json.dumps(p.port_blocks(), ensure_ascii=False)[:900])
          except Exception as e:
              print("  取不到：%s" % e)

          print("\n=== 拉全部空闲端口 ===")
          allp, off, total = [], 0, None
          while True:
              r = p.free_ports(uuid, "", off)
              chunk = r.get("ports") or []
              total = r.get("total")
              if not chunk:
                  break
              allp += chunk
              off += len(chunk)
              if len(allp) >= (total or 0) or len(allp) > 500:
                  break
          print("  共 %d 个（total=%s）" % (len(allp), total))
          print("  ", allp[:120])
          print("  历史端口 13131-13137 在里面吗：",
                [x for x in range(13131, 13138) if x in allp] or "一个都不在")
          sess.stop()
          PY
