name: 🔍 号段续费条款（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FC_USER: ${{ secrets.FC_USER_2 }}
      FC_PASS: ${{ secrets.FC_PASS_2 }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 把免费月数一次续完
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None,
                     # 29 天后才到期，临时放宽到 400 天，专门验证「一次续到免费上限」
                     "port_block_days": 400}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)

              print("=== 续之前 ===")
              for b in p.port_blocks().get("blocks") or []:
                  print("  id=%s %s-%s paid_until=%s"
                        % (b["id"], b["start"], b["start"] + b["size"] - 1,
                           b.get("paid_until")))
                  try:
                      t = p.port_block_renew_terms(b["id"])
                      print("      免费月数=%d monthly=%s totals前3=%s"
                            % (M.free_renew_months(t), t.get("monthly"),
                               (t.get("totals") or [])[:3]))
                  except PanelError as e:
                      print("      条款：%s" % e)

              print("\n=== 续费（dry-run 先看一眼）===")
              for row in M.renew_port_blocks(p, cfg, dry_run=True):
                  print("  %s" % (row,))

              print("\n=== 真续 ===")
              for row in M.renew_port_blocks(p, cfg):
                  print("  %s" % (row,))

              print("\n=== 续之后 ===")
              for b in p.port_blocks().get("blocks") or []:
                  print("  id=%s %s-%s paid_until=%s"
                        % (b["id"], b["start"], b["start"] + b["size"] - 1,
                           b.get("paid_until")))
          finally:
              sess.stop()
          PY
