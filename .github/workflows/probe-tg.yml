name: 🔍 预览新报告（临时）
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      FC_TG_TOKEN: ${{ secrets.FC_TG_TOKEN }}
      FC_TG_CHAT: ${{ secrets.FC_TG_CHAT }}
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      FC_USER_2: ${{ secrets.FC_USER_2 }}
      FC_PASS_2: ${{ secrets.FC_PASS_2 }}
      FC_USER_3: ${{ secrets.FC_USER_3 }}
      FC_PASS_3: ${{ secrets.FC_PASS_3 }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 看 dora 的全部优惠规则
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          import firadio_maintain as M
          from firadio_panel import Panel
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              opts = p.order_options()
              specs = {}
              for r in opts.get("regions") or []:
                  for s2 in r.get("specs") or []:
                      specs[s2["id"]] = (s2.get("name"), s2.get("vcores"),
                                         s2.get("memory_mb"))
              print("=== 全部 promos（不筛 rule）===")
              for pr in opts.get("promos") or []:
                  print("  %s" % json.dumps(pr, ensure_ascii=False))
              print("=== 规格表 ===")
              for sid, v in sorted(specs.items()):
                  print("  %s %s" % (sid, v))
              print("=== 各规格实际应付（1 个月）===")
              for sid, v in sorted(specs.items()):
                  for gb in (1,):
                      try:
                          print("  规格 %s %-12s 应付 %s"
                                % (sid, v[0],
                                   M.money(M.payable(opts, 1, sid, gb), opts)))
                      except Exception as e:
                          print("  规格 %s %s 算不出来：%s" % (sid, v[0], e))
          finally:
              sess.stop()
          PY
