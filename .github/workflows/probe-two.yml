name: 🔍 两段端口（临时）
on:
  workflow_dispatch:

jobs:
  two:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FC_USER: ${{ secrets.FC_USER }}
      FC_PASS: ${{ secrets.FC_PASS }}
      PROXY_CONTENT: ${{ secrets.HY2_PROXY_URL }}
      PRIVATE_REPO: jyucoeng/fc-private
      REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: 检出私有仓库
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            clone --depth 1 "https://github.com/${PRIVATE_REPO}.git" fc-private

      - name: 装 sing-box
        working-directory: fc-private
        run: |
          set -euo pipefail
          SB_VER="1.13.14"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box

      - name: 改成两段
        working-directory: fc-private
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          import firadio_maintain as M
          from firadio_panel import Panel, PanelError
          from firadio_proxy import ProxySession

          sess = ProxySession(content=os.environ["PROXY_CONTENT"], port=10808)
          sess.start()
          try:
              cfg = {"user": os.environ["FC_USER"], "password": os.environ["FC_PASS"],
                     "proxy": sess.url, "fingerprint": None, "session_file": None}
              p = Panel(proxy=sess.url)
              M.login(p, cfg)
              uuid = p.instances()[0]["uuid"]

              def nat():
                  return p.instance(uuid).get("nat") or []

              def show(tag):
                  print("%s" % tag)
                  for r in nat():
                      span = r.get("span", 1)
                      print("  %s %s%s" % (r.get("protocol"), r.get("port"),
                                           "-%d" % (r["port"] + span - 1) if span > 1 else ""))
                  print("  规则 %d / max_ports %s" % (len(nat()),
                                                     p.instance(uuid).get("max_ports")))

              show("=== 改之前 ===")

              for r in nat():
                  if (r.get("port") or 0) >= 13000:
                      try:
                          p.remove_port(uuid, r["port"], domain=1,
                                        span=r.get("span", 1))
                          print("  拆 %s %s ✅" % (r.get("protocol"), r["port"]))
                      except PanelError as e:
                          print("  拆 %s %s 失败：%s" % (r.get("protocol"), r["port"], e))
                      time.sleep(0.4)
              time.sleep(2)

              print("\n=== 用 2 段重挂（走 add_ports，port_span=20）===")
              done = M.add_ports(p, uuid, 5, 2,
                                 prefer=M.stable_port_candidates(p),
                                 total_ports=20)
              time.sleep(2)

              show("\n=== 改之后 ===")
              print("  add_ports 返回：%s" % done)
              print("  空闲端口：%s" % p.free_ports(uuid).get("total"))
          finally:
              sess.stop()
          PY
